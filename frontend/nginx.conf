server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida devolve o index, e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets tem hash no nome, entao podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
