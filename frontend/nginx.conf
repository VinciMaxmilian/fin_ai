server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao exata do nginx nas respostas e nas paginas de erro.
    server_tokens off;

    # Corpo de requisicao grande nao tem uso aqui: isto serve arquivos estaticos.
    client_max_body_size 1m;

    # -- Cabecalhos de seguranca ---------------------------------------------
    # `always` e essencial: sem ele o nginx omite estes cabecalhos nas respostas
    # de erro (4xx/5xx), justamente as que um atacante costuma provocar.
    #
    # A CSP e escrita pelo Dockerfile a partir das mesmas URLs usadas no build,
    # porque connect-src precisa apontar para a API e o Supabase reais.
    add_header Content-Security-Policy "__CSP__" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA: qualquer rota desconhecida devolve o index, e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets tem hash no nome, entao podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Arquivos ocultos (.env, .git) nunca deveriam estar no dist, mas se um dia
    # um build os copiar por engano, isto evita que sejam servidos.
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
